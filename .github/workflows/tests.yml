name: platform-engine-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts manifests experiments
      - run: python manifests/render.py selfheal/platform:ci > /tmp/platform.json
      - name: Validate host installer syntax
        run: for script in host/*.sh; do bash -n "$script"; done
      - name: Validate embedded console JavaScript
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          module=ast.parse(Path('src/platform_healer/controller.py').read_text())
          page=next(node.value.value for node in module.body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='PAGE' for target in node.targets))
          Path('/tmp/platform-ui.js').write_text(page.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/platform-ui.js
