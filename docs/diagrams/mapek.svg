<text x="1120" y="730" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="1120" dy="0">Watch only: no new dispatch.</tspan><tspan x="1120" dy="19.599999999999998">Approval records permission, not a direct write.</tspan></text>
<text x="70" y="1130" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="70" dy="0">Failure suspends automatic reuse. A new gateway identity requires qualification again. Broker lease reconciliation runs independently of the controller and defers unsafe rollback instead of forcing it.</tspan></text>
