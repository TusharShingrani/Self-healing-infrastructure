</defs>
<text x="40" y="55" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="40" dy="0">04  One incident, end to end</tspan></text>
<text x="40" y="95" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="40" dy="0">A technical reading path for the demo. Steps are causal order, not measured latency.</tspan></text>
<text x="40" y="137" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="40" dy="0">GREEN: HTTP workload    BLUE: telemetry requests    ORANGE: admitted effects    PURPLE: advice / investigation    GREY: administration</tspan></text>
