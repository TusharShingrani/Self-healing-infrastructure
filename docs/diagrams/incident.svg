<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc"><title id="title">04  One incident, end to end</title><desc id="desc">A technical reading path for the demo. Steps are causal order, not measured latency.</desc><rect width="100%" height="100%" fill="white"/><defs>
