<text x="230.0" y="310" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="230.0" dy="0">1  Controlled pressure</tspan></text>
<text x="230.0" y="334" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="230.0" dy="0">Bounded client holds connections</tspan><tspan x="230.0" dy="19.599999999999998">Separate probe VM</tspan></text>
<svg x="644.0" y="210" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="34"/><path d="M15 29h48m-10-9 10 9-10 9M65 51H17m10-9-10 9 10 9"/></g></svg>
<text x="680.0" y="310" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="680.0" dy="0">2  Observable failure</tspan></text>
<text x="680.0" y="334" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="680.0" dy="0">Pool 32/32, errno 99, errors</tspan><tspan x="680.0" dy="19.599999999999998">Independent HTTP requests fail</tspan></text>
<svg x="1164.0" y="210" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="31" r="22"/><path d="m48 47 24 24M19 35l9-13 10 17 8-10"/></g></svg>
<text x="1200.0" y="310" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1200.0" dy="0">3  Correlated diagnosis</tspan></text>
<text x="1200.0" y="334" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1200.0" dy="0">Backend still healthy</tspan><tspan x="1200.0" dy="19.599999999999998">Two confirming observations</tspan></text>
<svg x="1164.0" y="540" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="19" r="12"/><path d="M17 68v-9c0-23 46-23 46 0v9Z"/></g></svg>
<text x="1200.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1200.0" dy="0">4  Review fixed action</tspan></text>
<text x="1200.0" y="664" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1200.0" dy="0">Named approval, or already</tspan><tspan x="1200.0" dy="19.599999999999998">qualified scope in automatic mode</tspan></text>
<svg x="644.0" y="540" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 5 68 16v23c0 20-28 35-28 35S12 59 12 39V16Z"/><rect x="27" y="32" width="26" height="23" rx="3"/><path d="M31 32v-8a9 9 0 0 1 18 0v8"/><circle cx="40" cy="43" r="2"/></g></svg>
<text x="680.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="680.0" dy="0">5  Root applies lease</tspan></text>
<text x="680.0" y="664" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="680.0" dy="0">Validate, journal, range 256</tspan><tspan x="680.0" dy="19.599999999999998">HAProxy identity unchanged</tspan></text>
<svg x="194.0" y="540" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="32"/><path d="m21 40 13 13 25-29"/></g></svg>
<text x="230.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="230.0" dy="0">6  Verify useful work</tspan></text>
<text x="230.0" y="664" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="230.0" dy="0">Three distinct successful checks</tspan><tspan x="230.0" dy="19.599999999999998">While load continues in study</tspan></text>
<svg x="194.0" y="860" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18v45c0 14 56 14 56 0V18"/><ellipse cx="40" cy="18" rx="28" ry="11"/><path d="M12 39c0 14 56 14 56 0M12 57c0 14 56 14 56 0"/></g></svg>
<text x="230.0" y="960" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="230.0" dy="0">7  Retain outcome</tspan></text>
<text x="230.0" y="984" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="230.0" dy="0">Update scoped Knowledge</tspan><tspan x="230.0" dy="19.599999999999998">Failure suspends reuse</tspan></text>
<svg x="644.0" y="860" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="32"/><path d="M40 17v25l17 10"/></g></svg>
<text x="680.0" y="960" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="680.0" dy="0">8  Reconcile lease</tspan></text>
<text x="680.0" y="984" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="680.0" dy="0">Expiry + zero active connections</tspan><tspan x="680.0" dy="19.599999999999998">Compare value, restore range 32</tspan></text>
<svg x="1164.0" y="860" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M25 5h30l20 20v30L55 75H25L5 55V25Z"/><path d="M23 40h34"/></g></svg>
<text x="1200.0" y="960" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1200.0" dy="0">Wrong repair refused</tspan></text>
<text x="1200.0" y="984" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1200.0" dy="0">Backend outage / stale evidence</tspan><tspan x="1200.0" dy="19.599999999999998">Unsafe memory / reserved conflict</tspan></text>
<text x="70" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="70" dy="0">Recovery and rollback are different events. A verified repair may still have an active lease. Safe rollback waits for drain; changed values or identity become visible conflicts, not overwritten administrator work.</tspan></text>
</svg>