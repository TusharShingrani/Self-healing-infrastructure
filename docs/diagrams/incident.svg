<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1630" viewBox="0 0 1500 1630" role="img" aria-labelledby="title desc"><title id="title">04  What actually breaks, and what is repaired</title><desc id="desc">Illustrative readings explain the implemented rule. They are not a new measured trial. Follow the numbered arrows.</desc><rect width="100%" height="100%" fill="white"/><defs>
<marker id="arrow-request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/></marker>
<marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
<marker id="arrow-effect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/></marker>
<marker id="arrow-advice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker>
<marker id="arrow-admin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
<marker id="arrow-knowledge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker>
</defs>
<text x="40" y="55" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="start"><tspan x="40" dy="0">04  What actually breaks, and what is repaired</tspan></text>
<text x="40" y="95" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="40" dy="0">Illustrative readings explain the implemented rule. They are not a new measured trial. Follow the numbered arrows.</tspan></text>
<text x="40" y="137" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="40" dy="0">GREEN: HTTP workload    BLUE: telemetry requests    ORANGE: admitted effects    PURPLE: advice / investigation    GREY: administration</tspan></text>
<path d="M 650,300.0 L 840,300.0" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-request)"/>
<rect x="691.2" y="272.0" width="107.60000000000001" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="745.0" y="288.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#15803D" text-anchor="middle"><tspan x="745.0" dy="0">HTTP workload</tspan></text>
<path d="M 1120.0,410 L 1120.0,540" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-telemetry)"/>
<rect x="1001.4" y="447.0" width="237.20000000000002" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="1120.0" y="463.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#2563EB" text-anchor="middle"><tspan x="1120.0" dy="0">Measurements via broker + agent</tspan></text>
<path d="M 840,650.0 L 650,650.0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-telemetry)"/>
<rect x="626.4" y="622.0" width="237.20000000000002" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="745.0" y="638.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#2563EB" text-anchor="middle"><tspan x="745.0" dy="0">Cause: outgoing port exhaustion</tspan></text>
<path d="M 370.0,760 L 370.0,890" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arrow-effect)"/>
<rect x="208.2" y="797.0" width="323.6" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="370.0" y="813.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#C2410C" text-anchor="middle"><tspan x="370.0" dy="0">Later tick sends authenticated fixed intent</tspan></text>
<path d="M 650,1000.0 L 840,1000.0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-telemetry)"/>
<rect x="637.2" y="972.0" width="215.6" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="745.0" y="988.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#2563EB" text-anchor="middle"><tspan x="745.0" dy="0">Readback + fresh HTTP checks</tspan></text>
<path d="M 1120.0,1110 L 1120.0,1240" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-knowledge)"/>
<rect x="954.6" y="1147.0" width="330.8" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="1120.0" y="1163.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#0F766E" text-anchor="middle"><tspan x="1120.0" dy="0">Pass records success; failure suspends reuse</tspan></text>
<path d="M 370.0,1110 L 370.0,1240" fill="none" stroke="#C2410C" stroke-width="2" marker-end="url(#arrow-effect)"/>
<rect x="215.4" y="1147.0" width="309.2" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="370.0" y="1163.0" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#C2410C" text-anchor="middle"><tspan x="370.0" dy="0">Separate watchdog, not a controller stage</tspan></text>
<svg x="334.0" y="190" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="55" height="42" rx="4"/><path d="M32 51v14M17 65h30M12 29h10l6-11 8 22 8-11h10"/><circle cx="61" cy="56" r="12"/><path d="m69 65 9 10"/></g></svg>
<text x="370.0" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">1  Make real requests</tspan></text>
<text x="370.0" y="314" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="370.0" dy="0">probe-1 -&gt; HAProxy :18080 -&gt; backend :19080</tspan><tspan x="370.0" dy="19.599999999999998">Held connections occupy outgoing source ports.</tspan><tspan x="370.0" dy="19.599999999999998">Baseline namespace range: 40000-40031 (32 ports).</tspan></text>
<svg x="1084.0" y="190" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="34"/><path d="M15 29h48m-10-9 10 9-10 9M65 51H17m10-9-10 9 10 9"/></g></svg>
<text x="1120.0" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1120.0" dy="0">2  New requests fail</tspan></text>
<text x="1120.0" y="314" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1120.0" dy="0">Example: used_ports=32, range_size=32.</tspan><tspan x="1120.0" dy="19.599999999999998">Backend connect errors and HTTP 5xx rise.</tspan><tspan x="1120.0" dy="19.599999999999998">Allocation probe returns errno 99: no local address.</tspan></text>
<svg x="1084.0" y="540" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="31" r="22"/><path d="m48 47 24 24M19 35l9-13 10 17 8-10"/></g></svg>
<text x="1120.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1120.0" dy="0">3  Rule identifies the cause</tspan></text>
<text x="1120.0" y="664" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1120.0" dy="0">Port use &gt;=85%; both transaction checks fail.</tspan><tspan x="1120.0" dy="19.599999999999998">Upstream healthy; memory safe; no reserved overlap.</tspan><tspan x="1120.0" dy="19.599999999999998">Two consecutive eligible diagnoses are required.</tspan></text>
<svg x="334.0" y="540" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="19" r="12"/><path d="M17 68v-9c0-23 46-23 46 0v9Z"/></g></svg>
<text x="370.0" y="640" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">4  Operator authorises this repair</tspan></text>
<text x="370.0" y="664" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="370.0" dy="0">Console: approve expand_port_range with a reason.</tspan><tspan x="370.0" dy="19.599999999999998">Watch mode does not execute. Automatic mode needs</tspan><tspan x="370.0" dy="19.599999999999998">a matching, explicitly promoted procedure.</tspan></text>
<svg x="334.0" y="890" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 5 68 16v23c0 20-28 35-28 35S12 59 12 39V16Z"/><rect x="27" y="32" width="26" height="23" rx="3"/><path d="M31 32v-8a9 9 0 0 1 18 0v8"/><circle cx="40" cy="43" r="2"/></g></svg>
<text x="370.0" y="990" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">5  Change one Linux setting</tspan></text>
<text x="370.0" y="1014" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="370.0" dy="0">Root broker checks identity and expected old value.</tspan><tspan x="370.0" dy="19.599999999999998">In namespace only: ip_local_port_range becomes</tspan><tspan x="370.0" dy="19.599999999999998">40000-40255 (256 ports), with a 30-second lease.</tspan></text>
<svg x="1084.0" y="890" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="32"/><path d="m21 40 13 13 25-29"/></g></svg>
<text x="1120.0" y="990" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1120.0" dy="0">6  Prove requests work again</tspan></text>
<text x="1120.0" y="1014" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1120.0" dy="0">Controller checks the new range and probe results.</tspan><tspan x="1120.0" dy="19.599999999999998">Require 3 distinct successes spanning &gt;=2 seconds,</tspan><tspan x="1120.0" dy="19.599999999999998">within 20 seconds. A kernel write alone is not success.</tspan></text>
<svg x="1084.0" y="1240" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18v45c0 14 56 14 56 0V18"/><ellipse cx="40" cy="18" rx="28" ry="11"/><path d="M12 39c0 14 56 14 56 0M12 57c0 14 56 14 56 0"/></g></svg>
<text x="1120.0" y="1340" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="1120.0" dy="0">7  Remember the verified procedure</tspan></text>
<text x="1120.0" y="1364" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="1120.0" dy="0">Store incident, exact scope, action and outcome.</tspan><tspan x="1120.0" dy="19.599999999999998">After 2 verified occurrences since the last failure,</tspan><tspan x="1120.0" dy="19.599999999999998">a named operator may promote reuse for that scope.</tspan></text>
<svg x="334.0" y="1240" width="72" height="72" viewBox="0 0 80 80"><g fill="white" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="32"/><path d="M40 17v25l17 10"/></g></svg>
<text x="370.0" y="1340" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle"><tspan x="370.0" dy="0">8  Safely return to baseline</tspan></text>
<text x="370.0" y="1364" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#475569" text-anchor="middle"><tspan x="370.0" dy="0">Broker watchdog runs even if controller stops.</tspan><tspan x="370.0" dy="19.599999999999998">After lease expiry AND zero active connections,</tspan><tspan x="370.0" dy="19.599999999999998">restore 40000-40031 only if identity/value match.</tspan></text>
<text x="70" y="1530" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="start"><tspan x="70" dy="0">Only the namespace port pool is repaired: no HAProxy restart, VM resize, backend repair or host-wide sysctl change.</tspan><tspan x="70" dy="19.599999999999998">If the backend is down or evidence is missing, this action is refused. Gemini may explain evidence but cannot invent or run repairs.</tspan></text>
</svg>