<rect x="823.6" y="584.5" width="222.8" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="935.0" y="600.5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#C2410C" text-anchor="middle"><tspan x="935.0" dy="0">HMAC bounded intent via agent</tspan></text>
