<rect x="575.8" y="744.5" width="208.4" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="680.0" y="760.5" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#C2410C" text-anchor="middle"><tspan x="680.0" dy="0">Independent broker watchdog</tspan></text>
<path d="M 1350,282.5 L 1470,282 L 1470,932 L 1350,932.5" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-advice)" stroke-dasharray="7 5"/>
<rect x="1352.2" y="744" width="215.6" height="23" rx="4" fill="white" fill-opacity=".96"/>
<text x="1460" y="760" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#7C3AED" text-anchor="middle"><tspan x="1460" dy="0">Different cause: investigate</tspan></text>
