modules:
  http_healthz:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      no_follow_redirects: true
      preferred_ip_protocol: ip4
      # exact body, whitespace trimmed: "broken" must not pass for "ok"
      fail_if_body_not_matches_regexp:
        - "^\\s*ok\\s*$"
