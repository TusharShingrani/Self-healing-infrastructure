# Prometheus on the monitor instance (10.1.1.50).
# Fast intervals on purpose: the MAPE-K Monitor stage reads these series, and a
# slow scrape would show up directly as detection delay in the experiment.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Host metrics, systemd unit state and the healer-* facts from each app.
  - job_name: node
    static_configs:
      - targets: ["10.1.1.60:9100"]
        labels: {node: app-1}
      - targets: ["10.1.1.61:9100"]
        labels: {node: app-2}

  - job_name: nginx
    static_configs:
      - targets: ["10.1.1.60:9113"]
        labels: {node: app-1}
      - targets: ["10.1.1.61:9113"]
        labels: {node: app-2}

  # Availability as a user sees it: a request from another machine, with the
  # body checked. A unit reported active is not evidence that it serves.
  - job_name: healthz
    metrics_path: /probe
    params:
      module: [http_healthz]
    static_configs:
      - targets: ["http://10.1.1.60/healthz"]
        labels: {node: app-1}
      - targets: ["http://10.1.1.61/healthz"]
        labels: {node: app-2}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # The MAPE-K loop on the healer publishes its own state.
  - job_name: mapek
    static_configs:
      - targets: ["10.1.1.205:9105"]
        labels: {node: healer-ubuntu}
