# Base monitoring: job-specific probes and five role hosts are added by configure_jobs_monitor.py.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules/jobs.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: support_nodes
    static_configs:
      - targets: ["10.1.1.205:9100"]
        labels: {node: healer-ubuntu}
      - targets: ["10.1.1.50:9100"]
        labels: {node: monitor}
